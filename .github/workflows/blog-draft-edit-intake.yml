name: Blog draft edit intake

# The mobile draft-edit path, one stage past blog-idea-intake.yml's capture
# step. Opening a "Blog draft edit" issue (the issue form at
# .github/ISSUE_TEMPLATE/blog-draft-edit.yml, which renders as a native form
# in the GitHub phone app) replaces an existing draft's body (and any
# requested frontmatter overrides), optionally publishes it, commits, and
# closes the issue. This is the phone equivalent of `blog edit <slug>`
# followed by `blog publish <slug>`.
#
# Never touches an already-published post: scripts/blog_draft_edit_intake.py
# refuses (loudly) unless the slug names an existing `draft: true` post, with
# one narrow idempotency carve-out documented in that script's module
# docstring for the guaranteed opened+labeled double fire every templated
# issue causes.
#
# Own concurrency group, distinct from blog-idea-intake: unrelated files, no
# reason for the two pipelines to serialize against each other.

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-draft-edit-intake
  cancel-in-progress: false

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'blog-draft-edit')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Apply the edit
        id: intake
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          out=$(python scripts/blog_draft_edit_intake.py 2>err.txt)
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            # $out is exactly the script's slug=/title=/published= lines,
            # already in key=value form -- append verbatim.
            echo "$out" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'stderr<<INTAKE_STDERR_EOF'
            cat err.txt
            echo 'INTAKE_STDERR_EOF'
          } >> "$GITHUB_OUTPUT"
          cat err.txt >&2 || true

      # Publish-only pre-flight, mirroring `blog publish`'s own
      # run_all_linters() rigor for the higher-consequence path (the intake
      # script's own internal scoped check is a documented no-op when NOT
      # publishing, since lint_blog/lint_vocab skip draft: true posts).
      # lint_ideas is the one linter `blog publish` never runs itself --
      # needed here because this pipeline moves the ledger row directly.
      - name: Lint the ledger (publish only)
        id: lint_ideas
        if: steps.intake.outputs.status == '0' && steps.intake.outputs.published == 'true'
        continue-on-error: true
        run: python scripts/lint_ideas.py

      - name: Lint cross-surface facts (publish only)
        id: lint_facts
        if: steps.intake.outputs.status == '0' && steps.intake.outputs.published == 'true'
        continue-on-error: true
        run: python scripts/lint_facts.py

      - name: Lint blog sources, repo-wide (publish only)
        id: lint_blog_full
        if: steps.intake.outputs.status == '0' && steps.intake.outputs.published == 'true'
        continue-on-error: true
        run: python scripts/lint_blog.py

      - name: Lint vocabulary, repo-wide (publish only)
        id: lint_vocab_full
        if: steps.intake.outputs.status == '0' && steps.intake.outputs.published == 'true'
        continue-on-error: true
        run: python scripts/lint_vocab.py

      - name: Commit
        id: commit
        if: steps.intake.outputs.status == '0'
        env:
          SLUG: ${{ steps.intake.outputs.slug }}
          TITLE: ${{ steps.intake.outputs.title }}
          PUBLISHED: ${{ steps.intake.outputs.published }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LINT_IDEAS_OUTCOME: ${{ steps.lint_ideas.outcome }}
          LINT_FACTS_OUTCOME: ${{ steps.lint_facts.outcome }}
          LINT_BLOG_OUTCOME: ${{ steps.lint_blog_full.outcome }}
          LINT_VOCAB_OUTCOME: ${{ steps.lint_vocab_full.outcome }}
        run: |
          set -euo pipefail

          if [ "$PUBLISHED" = "true" ]; then
            for outcome in "$LINT_IDEAS_OUTCOME" "$LINT_FACTS_OUTCOME" \
                           "$LINT_BLOG_OUTCOME" "$LINT_VOCAB_OUTCOME"; do
              if [ "$outcome" = "failure" ]; then
                echo "lint-failed=true" >> "$GITHUB_OUTPUT"
                echo "publish pre-flight failed; nothing committed"
                exit 0
              fi
            done
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/blog/${SLUG}.md" src/content/blog-ideas.yaml
          if git diff --cached --quiet; then
            echo "already-applied=true" >> "$GITHUB_OUTPUT"
            echo "no changes to commit (duplicate fire or no-op edit)"
            exit 0
          fi

          if [ "$PUBLISHED" = "true" ]; then
            msg="Publish: ${TITLE} (#${ISSUE_NUMBER})"
            trailer="Blog-CLI-Linted: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            commit_msg="$(printf '%s\n\n%s' "$msg" "$trailer")"
          else
            commit_msg="Edit draft: ${TITLE} (#${ISSUE_NUMBER})"
          fi
          git commit -m "$commit_msg"

          # Same push-then-rebase retry the other intake/build workflows use.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebasing onto origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "rebase failed on attempt ${attempt}; will retry after backoff"
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push after 5 attempts"
          exit 1

      - name: Report back
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.intake.outputs.status }}
          STDERR: ${{ steps.intake.outputs.stderr }}
          SLUG: ${{ steps.intake.outputs.slug }}
          PUBLISHED: ${{ steps.intake.outputs.published }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          LINT_FAILED: ${{ steps.commit.outputs.lint-failed }}
          ALREADY_APPLIED: ${{ steps.commit.outputs.already-applied }}
        with:
          script: |
            const status = process.env.STATUS;
            const stderrText = (process.env.STDERR || '').trim();
            const slug = process.env.SLUG || '';
            const published = process.env.PUBLISHED === 'true';
            const commitOutcome = process.env.COMMIT_OUTCOME;
            const lintFailed = process.env.LINT_FAILED === 'true';
            const alreadyApplied = process.env.ALREADY_APPLIED === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const comment = (body) => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            // Duplicate opened+labeled fire for one templated issue, or a
            // resubmit that produced no actual change: quiet, no comment,
            // issue state is left exactly as the first run already set it.
            if (alreadyApplied) {
              console.log('duplicate fire or no-op edit; nothing new to report');
              return;
            }

            if (status !== '0') {
              await comment([
                'This edit could not be applied:',
                '',
                '```',
                stderrText || '(no error output captured)',
                '```',
                '',
                'Edit this issue to fix the field above; it will retry automatically.',
              ].join('\n'));
              return;
            }

            if (commitOutcome === 'failure') {
              await comment([
                'The edit was computed successfully, but pushing it to `main` ' +
                  'failed after 5 retries (see the ' +
                  `[workflow run](${runUrl}) for the git error).`,
                '',
                'Nothing was left committed. Edit this issue (even with no ' +
                  'changes) to retry.',
              ].join('\n'));
              return;
            }

            if (lintFailed) {
              await comment([
                'The edit applied cleanly, but publishing was blocked by a ' +
                  `failing lint check. See the [workflow run](${runUrl}) for details.`,
                '',
                'Nothing was committed. Fix the issue and edit this form to retry.',
              ].join('\n'));
              return;
            }

            const outcomeLine = published
              ? `Published: **${slug}** is now live on the next build. ` +
                `https://zaherkarp.com/blog/${slug}/`
              : `Draft **${slug}** was updated (still \`draft: true\`, not published).`;

            await comment([
              outcomeLine,
              '',
              'Closing this issue: the repo is the record now.',
            ].join('\n'));
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
