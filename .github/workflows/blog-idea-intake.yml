name: Blog idea intake

# The mobile capture path. Opening a "Blog idea" issue (the issue form at
# .github/ISSUE_TEMPLATE/blog-idea.yml, which renders as a native form in the
# GitHub phone app) lands a row in src/content/blog-ideas.yaml and closes the
# issue. The ledger stays the source of truth; the issue is just the capture
# surface, so ideas are versioned in the repo like every other content type
# here rather than living in a tracker.
#
# Idempotent: the `labeled` trigger fires on the template's own label, so a
# templated issue triggers this twice. blog_ideas_intake.py skips an issue
# already recorded as `source: issue#N`, which also makes re-labelling safe.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  # Serialize: two issues filed a minute apart would otherwise race on the
  # same file and one commit would clobber the other.
  group: blog-idea-intake
  cancel-in-progress: false

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'blog-idea')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Append the idea to the ledger
        id: intake
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          id=$(python scripts/blog_ideas_intake.py)
          if [ -z "$id" ]; then
            echo "already-ingested=true" >> "$GITHUB_OUTPUT"
            echo "issue already in the ledger; nothing to commit"
          else
            echo "already-ingested=false" >> "$GITHUB_OUTPUT"
            echo "idea-id=$id" >> "$GITHUB_OUTPUT"
            echo "assigned id: $id"
          fi

      # The gate runs against the file we just wrote, so a malformed capture
      # fails here instead of on someone's next push.
      - name: Lint the ledger
        if: steps.intake.outputs.already-ingested == 'false'
        run: python scripts/lint_ideas.py

      - name: Commit the ledger
        if: steps.intake.outputs.already-ingested == 'false'
        env:
          IDEA_ID: ${{ steps.intake.outputs.idea-id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog-ideas.yaml
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git commit -m "blog: capture idea ${IDEA_ID} (#${ISSUE_NUMBER})"

          # Same push-then-rebase retry the build workflows use: the portfolio
          # and resume builds can land on main while this runs.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebasing onto origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "rebase failed on attempt ${attempt}; will retry after backoff"
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push the captured idea after 5 attempts"
          exit 1

      - name: Confirm and close the issue
        if: steps.intake.outputs.already-ingested == 'false'
        uses: actions/github-script@v7
        env:
          IDEA_ID: ${{ steps.intake.outputs.idea-id }}
        with:
          script: |
            const id = process.env.IDEA_ID;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Captured as \`${id}\` in [\`src/content/blog-ideas.yaml\`](../blob/main/src/content/blog-ideas.yaml).`,
                '',
                'It will appear in `blog queue` and in the weekly backlog digest.',
                'When you are ready to write it:',
                '',
                '```bash',
                `blog promote ${id}`,
                '```',
                '',
                'Closing this issue: the ledger is the record now.',
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
